# Integración continua: las pruebas automáticas corren solas en cada push.
#
# ── Por qué este archivo está acá y no dentro de `proyectoFinal/` ─────────────────────────────
#
# El `CLAUDE.md` de la raíz dice que todo el trabajo de una sesión queda adentro de la carpeta del
# día. Este archivo es la única excepción, autorizada por la estudiante el 2026-08-19, y no por
# comodidad: **GitHub solo ejecuta los archivos que están en `.github/workflows/` en la raíz del
# repositorio.** Adentro de una subcarpeta los ignora, y entonces la comprobación 7 de la pieza 3
# —«hacer un push y ver las pruebas en verde»— no se podría cumplir de ninguna manera.
#
# La razón, con sus alternativas, está escrita en `proyectoFinal/DISENO.md`, sección «Decisiones
# tomadas al construir la pieza 3».
#
# ── Qué protege ──────────────────────────────────────────────────────────────────────────────
#
# `PROYECTO.md` §7, punto 4, pide que las reglas de negocio CA-1, CA-2 y CA-3 estén cubiertas por
# pruebas **que corran en cada push**. CA-1 (dos personas reservan el mismo horario y solo una lo
# consigue) y CA-2 (no hay citas para hoy) nacen con la pieza 3 y viven en
# `proyectoFinal/pruebas/reservas.test.js`. CA-3 llega con las piezas 5 y 7, y va a quedar cubierta
# por este mismo archivo sin tocarlo.

name: Pruebas

# Solo en cada push, a cualquier rama. Así nunca hay una rama con las pruebas rotas sin que se note.
#
# *Cambiado el 2026-08-25, a pedido de la estudiante: antes también corría en cada pull request.* Se
# quitó ese disparador porque duplicaba trabajo sin agregar información: al abrir un pull request la
# rama ya viene de un push, y ese push ya corrió esta misma suite sobre el mismo código. GitHub
# mostraba dos resultados idénticos y consumía el doble de minutos.
on:
  push:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    # ── Las dos versiones de Node que el proyecto promete ─────────────────────────────────────
    #
    # El `README.md` promete «Node.js 20 o superior». Correr las pruebas en Node 20 **y** en Node 24
    # es lo que convierte esa frase en algo comprobado en vez de una promesa escrita: si alguna
    # dependencia dejara de servir en Node 20, se ve acá y no en la máquina de quien clone el
    # repositorio. Ya pasó una vez, al montar esta integración: `better-sqlite3` había quedado en una
    # versión que exige Node 22, y hubo que bajarla.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    # El proyecto no vive en la raíz del repositorio, sino en `proyectoFinal/`, así que todos los
    # comandos se corren adentro de esa carpeta.
    defaults:
      run:
        working-directory: proyectoFinal

    steps:
      # Trae una copia del repositorio a la máquina donde va a correr todo.
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # Guarda las dependencias descargadas para que la próxima vez tarde menos.
          cache: npm
          cache-dependency-path: proyectoFinal/package-lock.json

      # `npm ci` en vez de `npm install`: instala **exactamente** las versiones que dice
      # `package-lock.json`, sin actualizar nada por su cuenta. Es lo que hace que acá corra lo mismo
      # que corre en la máquina de la estudiante.
      - name: Instalar las dependencias
        run: npm ci

      - name: Correr las pruebas
        run: npm test
