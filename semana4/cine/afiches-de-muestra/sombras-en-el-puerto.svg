<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="Afiche de Sombras en el puerto">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2136"/>
      <stop offset="55%" stop-color="#123b52"/>
      <stop offset="100%" stop-color="#05121d"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2a3d"/>
      <stop offset="100%" stop-color="#040b12"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#cielo)"/>
  <circle cx="300" cy="130" r="52" fill="#f2ca50" opacity="0.92"/>
  <circle cx="282" cy="118" r="52" fill="#123b52" opacity="0.55"/>

  <!-- gruas y barcos, en silueta -->
  <g fill="#04101a">
    <rect x="40" y="250" width="10" height="150"/>
    <rect x="40" y="250" width="90" height="9"/>
    <rect x="122" y="259" width="8" height="34"/>
    <rect x="150" y="300" width="8" height="100"/>
    <rect x="150" y="300" width="62" height="7"/>
    <path d="M232 400 L262 330 L292 400 Z"/>
    <rect x="258" y="316" width="6" height="86"/>
  </g>

  <rect y="400" width="400" height="200" fill="url(#agua)"/>
  <g fill="#f2ca50" opacity="0.28">
    <rect x="292" y="410" width="16" height="4" rx="2"/>
    <rect x="286" y="430" width="28" height="4" rx="2"/>
    <rect x="294" y="450" width="12" height="4" rx="2"/>
    <rect x="284" y="472" width="32" height="4" rx="2"/>
  </g>

  <text x="200" y="512" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#e5e2e1" letter-spacing="1">SOMBRAS</text>
  <text x="200" y="548" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#d0c5af" letter-spacing="6">EN EL PUERTO</text>
  <rect x="150" y="566" width="100" height="2" fill="#f2ca50"/>
</svg>
